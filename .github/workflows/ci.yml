name: AI Model CI/CD

# 當有人推送到 main 分支時，自動觸發測試
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest # 使用 GitHub 免費提供的 Linux 伺服器

    steps:
    - name: 📥 下載最新程式碼
      uses: actions/checkout@v3

    - name: 🐍 設定 Python 3.10 環境
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: 📦 安裝核心套件
      run: |
        python -m pip install --upgrade pip
        pip install pytest torch torchvision timm

    - name: 🧪 執行 Pytest 單元測試
      run: |
        pytest tests/